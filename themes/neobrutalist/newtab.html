<div class="nb-page">
  <main class="nb-stage">
    <div class="nb-hero-wrap">
      <span class="nb-badge nb-badge-pink">SEU</span>
      <span class="nb-badge nb-badge-yellow">NAVEGADOR</span>
    </div>

    <form class="nb-search" data-seu-submit="search">
      <div class="nb-search-inner">
        <i class="fa-solid fa-magnifying-glass nb-s-ico" aria-hidden="true"></i>
        <input class="nb-search-input" type="text" autocomplete="off" data-seu-input="search" data-seu-placeholder-t="newtab.searchPlaceholder" aria-label="Pesquisar" />
        <button type="submit" class="nb-search-btn" data-seu-t="newtab.searchButton">BUSCAR</button>
      </div>
    </form>

    <div class="nb-chips" data-seu-container="searchCategories">
      <template data-seu-repeat="searchCategories">
        <button type="button" class="nb-chip" data-seu-action="search.setCategory" data-seu-param="$item.id" data-seu-bind="$item.label">WEB</button>
      </template>
    </div>

    <div class="nb-shortcuts" data-seu-container="shortcuts">
      <template data-seu-repeat="shortcuts">
        <a class="nb-sc" data-seu-href="$item.url" data-seu-action="tabs.navigate" data-seu-param="$item.url">
          <span class="nb-sc-code" data-seu-bind="$item.code">YT</span>
          <span data-seu-bind="$item.name">YouTube</span>
        </a>
      </template>
    </div>

    <div class="nb-widgets">
      <div class="nb-card nb-c-blue">
        <div class="nb-c-kicker" data-seu-t="y2k.tickerSleeping">ABAS DORMINDO</div>
        <div class="nb-c-val" data-seu-bind="memory.sleepingSummary">0 abas · 0 MB livres</div>
      </div>
      <div class="nb-card nb-c-white nb-c-row">
        <div class="nb-c-val" data-seu-t="y2k.gameModeTitle">Modo jogo</div>
        <button type="button" class="nb-c-btn nb-c-green" data-seu-action="gameMode.toggle" data-seu-bind="gameMode.label">DESLIGADO</button>
      </div>
      <div class="nb-card nb-c-lilac nb-c-row">
        <div>
          <div class="nb-c-kicker">TEMA</div>
          <div class="nb-c-val" data-seu-bind="theme.name">Neobrutalista</div>
        </div>
        <button type="button" class="nb-c-btn nb-c-yellow" data-seu-action="tabs.navigateThemes">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </main>
</div>

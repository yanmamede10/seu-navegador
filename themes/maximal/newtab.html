<div class="mx-page">
  <div class="mx-grid">
    <section class="mx-hero-block">
      <svg class="mx-sun" viewBox="0 0 100 100" aria-hidden="true">
        <polygon points="50,0 58,30 88,12 70,40 100,50 70,60 88,88 58,70 50,100 42,70 12,88 30,60 0,50 30,40 12,12 42,30" fill="#F2B705" stroke="#141414" stroke-width="3"></polygon>
      </svg>
      <span class="mx-seu">seu</span>
      <h1 class="mx-title">Navegador</h1>
    </section>

    <div class="mx-eye-block">
      <svg width="136" height="78" viewBox="0 0 140 80" aria-hidden="true">
        <path d="M5 40C35 0 105 0 135 40C105 80 35 80 5 40Z" fill="#F2EBDD" stroke="#141414" stroke-width="5"></path>
        <circle cx="70" cy="40" r="22" fill="#6B3FA0" stroke="#141414" stroke-width="5"></circle>
        <circle cx="70" cy="40" r="9" fill="#141414"></circle>
      </svg>
    </div>

    <div class="mx-sleep-block">
      <span class="mx-kicker" data-seu-t="y2k.tickerSleeping">ABAS DORMINDO</span>
      <span class="mx-sleep-val" data-seu-bind="memory.sleepingSummary">0 abas · 0 MB de volta</span>
    </div>

    <div class="mx-search-block">
      <form class="mx-search-form" data-seu-submit="search">
        <div class="mx-search-inner">
          <span class="mx-s-lbl">Busque:</span>
          <input class="mx-search-input" type="text" autocomplete="off" data-seu-input="search" data-seu-placeholder-t="newtab.searchPlaceholder" aria-label="Pesquisar" />
          <button type="submit" class="mx-search-btn" data-seu-t="newtab.searchButton">Vai!</button>
        </div>
      </form>
      <div class="mx-chips" data-seu-container="searchCategories">
        <template data-seu-repeat="searchCategories">
          <button type="button" class="mx-chip" data-seu-action="search.setCategory" data-seu-param="$item.id" data-seu-bind="$item.label">WEB</button>
        </template>
      </div>
    </div>

    <div class="mx-shortcuts-strip" data-seu-container="shortcuts">
      <template data-seu-repeat="shortcuts">
        <a class="mx-sc" data-seu-href="$item.url" data-seu-action="tabs.navigate" data-seu-param="$item.url">
          <span class="mx-sc-badge" data-seu-bind="$item.code">YT</span>
          <span class="mx-sc-name" data-seu-bind="$item.name">YouTube</span>
        </a>
      </template>
    </div>

    <div class="mx-chk-block" aria-hidden="true"></div>
    <div class="mx-gm-block">
      <span class="mx-gm-title" data-seu-t="y2k.gameModeTitle">modo jogo</span>
      <div class="mx-gm-btns">
        <button type="button" class="mx-gm-btn" data-seu-action="gameMode.toggle" data-seu-bind="gameMode.label">DESLIGADO</button>
        <button type="button" class="mx-gm-btn mx-gal-btn" data-seu-action="tabs.navigateThemes">TEMAS</button>
      </div>
    </div>
  </div>
</div>

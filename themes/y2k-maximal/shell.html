<div class="y2k-shell" data-seu-root="shell">
  <header class="y2k-bar y2k-titlebar">
    <div class="y2k-drag" data-seu-drag-region>
      <svg class="y2k-star" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="#FFFFFF"></path>
      </svg>
      <span class="y2k-title-text">
        <span>SEU_NAVEGADOR.exe — </span>
        <span data-seu-bind="activeTab.title">nova aba</span>
      </span>
      <span class="y2k-incognito-tag" data-seu-if="window.incognito" data-seu-t="app.incognito">ANÔNIMO</span>
    </div>
    <div class="y2k-win-btns">
      <button type="button" class="y2k-win-btn" data-seu-action="windows.minimize" data-seu-title-t="window.minimize" aria-label="Minimizar">
        <i class="fa-solid fa-minus" aria-hidden="true"></i>
      </button>
      <button type="button" class="y2k-win-btn" data-seu-action="windows.maximize" data-seu-title-t="window.maximize" aria-label="Maximizar">
        <i class="fa-regular fa-square" aria-hidden="true"></i>
      </button>
      <button type="button" class="y2k-win-btn y2k-win-close" data-seu-action="windows.close" data-seu-title-t="window.close" aria-label="Fechar">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <div class="y2k-tabbar">
    <div class="y2k-groups" data-seu-container="tabGroups">
      <template data-seu-repeat="tabGroups">
        <button type="button" class="y2k-group-chip" data-seu-action="tabGroups.toggleCollapse" data-seu-style-bg="$item.color">
          <i data-seu-icon="$item.collapseIcon" aria-hidden="true"></i>
          <span data-seu-bind="$item.title">Grupo</span>
        </button>
      </template>
    </div>
    <div class="y2k-tabs" data-seu-container="tabs">
      <template data-seu-repeat="tabs">
        <div class="y2k-tab" data-seu-action="tabs.activate" data-seu-context-action="tabs.pin" data-seu-middle-action="tabs.close">
          <i class="y2k-tab-glyph" data-seu-icon="$item.icon" aria-hidden="true"></i>
          <span class="y2k-tab-title" data-seu-bind="$item.title">Início</span>
          <span class="y2k-tab-zzz" data-seu-if="$item.isSleeping">zzz</span>
          <button type="button" class="y2k-tab-close" data-seu-action="tabs.close" data-seu-title-t="tabs.close" aria-label="Fechar aba">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
      </template>
    </div>
    <button type="button" class="y2k-newtab-btn" data-seu-action="tabs.create" data-seu-title-t="tabs.new" aria-label="Nova aba">
      <i class="fa-solid fa-plus" aria-hidden="true"></i>
    </button>
  </div>

  <div class="y2k-navbar">
    <button type="button" class="y2k-nav-btn" data-seu-action="tabs.back" data-seu-disabled-unless="activeTab.can_go_back" data-seu-title-t="nav.back" aria-label="Voltar">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    </button>
    <button type="button" class="y2k-nav-btn" data-seu-action="tabs.forward" data-seu-disabled-unless="activeTab.can_go_forward" data-seu-title-t="nav.forward" aria-label="Avançar">
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </button>
    <button type="button" class="y2k-nav-btn" data-seu-action="tabs.reload" data-seu-title-t="nav.reload" aria-label="Recarregar">
      <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
    </button>

    <form class="y2k-omnibox" data-seu-submit="omnibox">
      <span class="y2k-prompt">&gt;_</span>
      <input class="y2k-url-input" type="text" autocomplete="off" spellcheck="false" data-seu-input="omnibox" data-seu-placeholder-t="nav.omniboxPlaceholder" aria-label="Endereço" />
    </form>

    <button type="button" class="y2k-ram-pill" data-seu-action="overlay.toggleMemory" data-seu-title-t="badge.ram">
      <i class="fa-solid fa-microchip" aria-hidden="true"></i>
      <span data-seu-bind="memory.badgeText">RAM -- MB</span>
    </button>
    <span class="y2k-blocker-pill">
      <i class="fa-solid fa-shield-halved" aria-hidden="true"></i>
      <span data-seu-bind="blocker.totalBlocked">0</span>
      <span data-seu-t="y2k.blocked">bloqueados</span>
    </span>
    <button type="button" class="y2k-nav-btn y2k-menu-btn" data-seu-action="overlay.toggleMenu" data-seu-title-t="nav.menu" aria-label="Menu">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
  </div>
</div>

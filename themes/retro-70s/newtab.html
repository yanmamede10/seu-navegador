<div class="r70-page">
  <div class="r70-rings" aria-hidden="true"></div>
  <main class="r70-stage">
    <h1 class="r70-hero">Seu Navegador</h1>
    <p class="r70-tagline">leve · groovy · seu</p>

    <form class="r70-search" data-seu-submit="search">
      <div class="r70-search-inner">
        <input class="r70-search-input" type="text" autocomplete="off" data-seu-input="search" data-seu-placeholder-t="newtab.searchPlaceholder" aria-label="Pesquisar" />
        <button type="submit" class="r70-search-btn" data-seu-t="newtab.searchButton">Buscar</button>
      </div>
    </form>

    <div class="r70-chips" data-seu-container="searchCategories">
      <template data-seu-repeat="searchCategories">
        <button type="button" class="r70-chip" data-seu-action="search.setCategory" data-seu-param="$item.id" data-seu-bind="$item.label">Web</button>
      </template>
    </div>

    <div class="r70-shortcuts" data-seu-container="shortcuts">
      <template data-seu-repeat="shortcuts">
        <a class="r70-sc" data-seu-href="$item.url" data-seu-action="tabs.navigate" data-seu-param="$item.url">
          <span class="r70-sc-orb" data-seu-bind="$item.code">YT</span>
          <span data-seu-bind="$item.name">YouTube</span>
        </a>
      </template>
    </div>

    <div class="r70-widgets">
      <div class="r70-card r70-c-teal">
        <div class="r70-c-kicker" data-seu-t="y2k.tickerSleeping">ABAS DORMINDO</div>
        <div class="r70-c-val" data-seu-bind="memory.sleepingSummary">0 abas · 0 MB de volta</div>
      </div>
      <div class="r70-card r70-c-mustard r70-c-row">
        <div class="r70-c-val" data-seu-t="y2k.gameModeTitle">Modo jogo</div>
        <button type="button" class="r70-dark-btn" data-seu-action="gameMode.toggle" data-seu-bind="gameMode.label">DESLIGADO</button>
      </div>
      <div class="r70-card r70-c-paper r70-c-row">
        <div>
          <div class="r70-c-kicker">TEMA ATIVO</div>
          <div class="r70-c-val" data-seu-bind="theme.name">Retrô anos 70</div>
        </div>
        <button type="button" class="r70-dark-btn" data-seu-action="tabs.navigateThemes">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </main>
</div>

name: Phase 0 Spike (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "spike/**"
      - ".github/workflows/spike-phase0.yml"

jobs:
  build-spike:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike -> target

      - name: Cache CEF binaries
        id: cache-cef
        uses: actions/cache@v4
        with:
          path: ~\cef-cache
          key: win64-cef-156-v1

      - name: Export CEF directory (if cache miss)
        if: steps.cache-cef.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cargo install export-cef-dir --version "^156" --locked
          export-cef-dir --force "$env:USERPROFILE\cef-cache"

      - name: Configure CEF environment
        shell: pwsh
        run: |
          $cefDir = "$env:USERPROFILE\cef-cache"
          echo "CEF_PATH=$cefDir" >> $env:GITHUB_ENV
          echo "$cefDir" >> $env:GITHUB_PATH

      - name: Check formatting
        working-directory: spike
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: spike
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        working-directory: spike
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $outDir = "dist\seu-navegador-spike-win64"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          # Copy CEF runtime files
          Copy-Item -Path "$env:CEF_PATH\*" -Destination $outDir -Recurse -Force

          # Copy built executable and RAM measurement script
          Copy-Item -Path "spike\target\release\seu-navegador-spike.exe" -Destination $outDir -Force
          Copy-Item -Path "spike\measure-ram.ps1" -Destination $outDir -Force

          # Remove development-only files (headers/libs/cmake) to keep the portable zip lean
          foreach ($devDir in @("include", "libcef_dll", "cmake", "Release", "Debug")) {
            $p = Join-Path $outDir $devDir
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          Get-ChildItem -Path $outDir -Include "*.lib","*.exp","*.pdb","*.cmake","CMakeLists.txt" -Recurse | Remove-Item -Force -ErrorAction SilentlyContinue

          Compress-Archive -Path "$outDir\*" -DestinationPath "dist\seu-navegador-spike-win64.zip" -Force

      - name: Upload portable spike artifact
        uses: actions/upload-artifact@v4
        with:
          name: seu-navegador-spike-win64
          path: dist/seu-navegador-spike-win64.zip
          retention-days: 14
